<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nos Produits</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 10px; }
    </style>
</head>
<body>
    <h1>Nos Produits</h1>
    <table>
        <tr>
            <th>Nom</th>
            <th>Marque</th>
            <th>Catégorie</th>
            <th>Stock</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.nom }}</td>
            <td>{{ product.marque }}</td>
            <td>{{ product.category.nom }}</td>
            <td>{{ product.stock }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
